# 推到 main 分支就自動建置並部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 頁面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，後推的會取代前一個
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 片單放在 playlists/：library/*.txt（學習庫，一個主題一個檔）＋ videos.txt（家長自己的影片），
      # npm run build 之前會自動合併成 public/playlist.txt，並檢查有沒有寫錯（scripts/build-playlist.mjs，
      # 有問題會在執行結果標黃色 warning，不擋部署）。
      # 以前放在 PLAYLIST secret 的做法已經不用了，那個 secret 可以刪掉。

      # 「新增影片」表單的分區選單有沒有跟上片單（只提醒，不擋部署）
      - name: 檢查分區選單
        run: node scripts/sync-video-form.mjs --check

      # GitHub Pages 的網址分兩種：
      #   <帳號>.github.io          → 網站在根目錄
      #   <帳號>.github.io/<repo>/  → 網站在子目錄，Vite 要知道這個前綴
      - name: 決定 base path
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      # 少了這個檔案，GitHub Pages 會用 Jekyll 處理，
      # 把底線開頭的目錄整個忽略掉，網站就變空白
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
